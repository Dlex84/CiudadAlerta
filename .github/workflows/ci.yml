name: CI
on:
  push: { branches: [main, develop] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciudadalerta
          POSTGRES_PASSWORD: ciudadalerta
          POSTGRES_DB: ciudadalerta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ciudadalerta" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      TEST_DATABASE_URL: postgres://ciudadalerta:ciudadalerta@localhost:5432/ciudadalerta_test
    steps:
      - uses: actions/checkout@v4
      # Sin "cache: npm": esa opción falla si aún no existe package-lock.json.
      # Cuando hagan commit de los lockfiles pueden añadir:
      #   cache: npm
      #   cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test   # incluye la integración contra PostgreSQL real

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
